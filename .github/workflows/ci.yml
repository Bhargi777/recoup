name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RAZORPAY_KEY_ID: rzp_test_dummy_ci_key
      RAZORPAY_KEY_SECRET: dummy_ci_secret
      RAZORPAY_WEBHOOK_SECRET: dummy_ci_webhook_secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check core recoup tests

      - name: Test (pytest)
        run: pytest
