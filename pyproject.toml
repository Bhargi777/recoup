[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recoup"
version = "0.1.0"
description = "AI-powered revenue recovery engine for Razorpay Test Mode."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.19",
  "typer>=0.12",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0.1",
  "anthropic>=0.34",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.4",
]

[project.scripts]
recoup = "recoup.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["core", "recoup"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: exercises the real end-to-end pipeline (e.g. run_batch over all 600 synthetic records) and can take up to a minute.",
]
