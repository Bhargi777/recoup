root_cause: card_expired
trigger_conditions:
  cohorts:
    - one_time_checkout_failure
    - subscription_mandate_failure
intervention_ladder:
  - step: reminder_message
    offset: "T+0"
    channel: sms
    notes: "Prompt customer to update card details."
  - step: payment_link
    offset: "T+2h"
    channel: email
  - step: pre_debit_notification
    offset: "T+24h"
    notes: "Only applies if a replacement mandate is registered; RBI 24h pre-debit notice."
  - step: mandate_retry
    offset: "T+48h"
  - step: escalate_to_human
    offset: "T+72h"
incentive_ceiling:
  type: amount_inr
  value: 0
max_attempts: 3
stopping_rules:
  - already_paid
  - max_attempts_reached
  - customer_opted_out
  - kill_switch_active
