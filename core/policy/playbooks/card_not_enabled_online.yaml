root_cause: card_not_enabled_online
trigger_conditions:
  cohorts:
    - one_time_checkout_failure
    - subscription_mandate_failure
intervention_ladder:
  - step: reminder_message
    offset: "T+0"
    channel: sms
    notes: "Ask customer to enable card for online/international transactions via their bank app."
  - step: payment_link
    offset: "T+4h"
    channel: email
  - step: escalate_to_human
    offset: "T+72h"
incentive_ceiling:
  type: amount_inr
  value: 0
max_attempts: 3
stopping_rules:
  - already_paid
  - max_attempts_reached
  - customer_opted_out
  - kill_switch_active
