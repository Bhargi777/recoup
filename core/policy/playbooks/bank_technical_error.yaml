root_cause: bank_technical_error
trigger_conditions:
  cohorts:
    - one_time_checkout_failure
    - subscription_mandate_failure
intervention_ladder:
  - step: reminder_message
    offset: "T+1h"
    channel: sms
    notes: "Issuer-side technical failure, not the customer's fault."
  - step: pre_debit_notification
    offset: "T+24h"
    notes: "RBI e-mandate pre-debit notice, >=24h before any retried mandate debit."
  - step: mandate_retry
    offset: "T+48h"
  - step: payment_link
    offset: "T+72h"
    channel: email
  - step: escalate_to_human
    offset: "T+96h"
incentive_ceiling:
  type: amount_inr
  value: 0
max_attempts: 4
stopping_rules:
  - already_paid
  - max_attempts_reached
  - customer_opted_out
  - kill_switch_active
