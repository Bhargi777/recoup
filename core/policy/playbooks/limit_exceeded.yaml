root_cause: limit_exceeded
trigger_conditions:
  cohorts:
    - one_time_checkout_failure
    - subscription_mandate_failure
intervention_ladder:
  - step: reminder_message
    offset: "T+0"
    channel: sms
    notes: "Issuer-side transaction limit exceeded; suggest a different card or lower amount."
  - step: payment_link
    offset: "T+2h"
    channel: email
  - step: escalate_to_human
    offset: "T+48h"
incentive_ceiling:
  type: amount_inr
  value: 0
max_attempts: 3
stopping_rules:
  - already_paid
  - max_attempts_reached
  - customer_opted_out
  - kill_switch_active
